<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="OpenMoney Cloud - Gestão Financeira Pessoal Multiplataforma com Base Criptografada e Isolada por Usuário.">
  <meta name="theme-color" content="#0A0E17">

  <!-- Prevenção de Cache Estático no Safari/iOS e Navegadores Mobile -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS / macOS Safari / PWA meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OpenMoney">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="apple-touch-icon-precomposed.png?v=3">
  <link rel="mask-icon" href="safari-pinned-tab.svg?v=3" color="#10B981">

  <!-- Favicon & Bookmark Icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png?v=3">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=3">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=3">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=3">
  <link rel="shortcut icon" href="favicon.ico?v=3">

  <title>OpenMoney Cloud</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0A0E17;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #loading-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 14px;
    }
    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(16, 185, 129, 0.22);
      border-top-color: #10B981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <img src="icons/Icon-192.png" width="64" height="64" alt="OpenMoney" style="border-radius: 16px;" />
    <div class="spinner"></div>
    <div style="font-size: 14px; font-weight: 600; letter-spacing: -0.2px; opacity: 0.85;">
      Carregando OpenMoney Cloud...
    </div>
  </div>
  <script>
    // Limpeza de Service Workers legados e caches que travam o Safari no iOS
    (function () {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (var reg of registrations) {
            reg.unregister();
          }
        });
      }

      function checkAppUpdate() {
        fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
          .then(function (res) { return res.json(); })
          .then(function (data) {
            if (data && data.version) {
              var build = data.build_number || data.buildNumber || '';
              var remoteVer = data.version + '+' + build;
              var localVer = localStorage.getItem('om_active_build');
              if (localVer && localVer !== remoteVer) {
                localStorage.setItem('om_active_build', remoteVer);
                if ('caches' in window) {
                  caches.keys().then(function (names) {
                    Promise.all(names.map(function (name) { return caches.delete(name); }))
                      .then(function () { window.location.reload(); });
                  });
                } else {
                  window.location.reload();
                }
              } else {
                localStorage.setItem('om_active_build', remoteVer);
              }
            }
          })
          .catch(function () {});
      }

      // Checa versão no carregamento e ao voltar para a aba no Safari iOS
      checkAppUpdate();
      window.addEventListener('pageshow', function (event) {
        if (event.persisted) {
          checkAppUpdate();
        }
      });
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') {
          checkAppUpdate();
        }
      });
    })();

    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.remove();
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

name = "openmoney"
pages_build_output_dir = "build/web"
compatibility_date = "2025-01-01"

# ==============================================================================
# Configuração do Banco de Dados Cloudflare D1 (Plano Gratuito - Até 5 GB)
# Após criar o banco com: npx wrangler d1 create openmoney-db
# Substitua o database_id abaixo pelo ID retornado no seu terminal/painel.
# ==============================================================================
[[d1_databases]]
binding = "DB"
database_name = "openmoney-db"
database_id = "4b2fdf86-f321-43f1-b76b-dfc704c88bf1"

[vars]
# Opcional: se preenchido no painel da Cloudflare, exige este código de convite
# para que apenas seus ~50 usuários autorizados possam criar novas contas.
INVITE_CODE = ""

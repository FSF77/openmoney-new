name = "openmoney-sync"
main = "src/index.js"
compatibility_date = "2026-03-01"

[durable_objects]
bindings = [
  { name = "SYNC", class_name = "UserSyncRoom" }
]

# new_sqlite_classes é obrigatório para habilitar Durable Objects no plano Free da Cloudflare
[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserSyncRoom"]
